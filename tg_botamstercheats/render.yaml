services:
  - type: web
    name: bcwallfiles-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python -u main.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        value: "7479229021,823427049"
      - key: MANDATORY_CHANNEL
        value: "@dfgames2"
