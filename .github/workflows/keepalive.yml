# Пинг Render каждые 5 минут, чтобы Free-сервис не засыпал.
# ПК можно выключать — работает через GitHub Actions.

name: Keep Render Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        env:
          # Секрет KEEP_ALIVE_URL опционален; иначе используется URL сервиса.
          KEEP_ALIVE_URL: ${{ secrets.KEEP_ALIVE_URL }}
        run: |
          URL="${KEEP_ALIVE_URL:-https://amsterbot.onrender.com}"
          URL="${URL%/}/"
          echo "GET $URL"
          for i in 1 2 3 4 5; do
            if curl -fsS -A "amsterbot-keepalive/1.0" --max-time 60 -o /tmp/keepalive.out -w "HTTP %{http_code}\n" "$URL"; then
              head -c 64 /tmp/keepalive.out || true
              echo
              exit 0
            fi
            echo "Попытка $i не удалась, ждём (холодный старт)..."
            sleep 15
          done
          echo "Не удалось достучаться до Render"
          exit 1
